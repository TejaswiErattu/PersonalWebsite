<!--
  Site icon: one of the village houses on grass.

  Drawn on a 16x16 grid with hard-edged rectangles and shape-rendering
  crispEdges, so it stays pixel-sharp at 16px in a browser tab and scales
  cleanly to 512px for the web manifest without ever going soft. The palette
  matches the game world and the site's CSS custom properties.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <title>A pixel-art house on grass</title>

  <!-- Grass -->
  <rect width="16" height="16" fill="#4d9450" />
  <!-- Darker grass band, echoing the tile variation in the village -->
  <rect y="13" width="16" height="3" fill="#3f7a43" />

  <!-- Roof -->
  <rect x="1" y="3" width="14" height="3" fill="#5c3a1f" />
  <rect x="2" y="2" width="12" height="1" fill="#6f4b26" />

  <!-- Walls -->
  <rect x="2" y="6" width="12" height="7" fill="#c08b4f" />
  <rect x="2" y="6" width="12" height="1" fill="#a97640" />

  <!-- Windows -->
  <rect x="3" y="8" width="3" height="3" fill="#eef3f7" />
  <rect x="10" y="8" width="3" height="3" fill="#eef3f7" />
  <rect x="4" y="9" width="1" height="1" fill="#2b3946" />
  <rect x="11" y="9" width="1" height="1" fill="#2b3946" />

  <!-- Door -->
  <rect x="7" y="9" width="3" height="4" fill="#3b2b1d" />
</svg>
